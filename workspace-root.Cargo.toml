[workspace]
resolver = "2"
members = [
    "cloud-backend",
    "crypto",
    "guard",
    "platform/pkg/zap",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Hanzo AI ecosystem - AI infrastructure and blockchain technology"
authors = ["Hanzo AI Team <dev@hanzo.ai>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/hanzoai/hanzo"
homepage = "https://hanzo.ai"
documentation = "https://docs.hanzo.ai"
keywords = ["ai", "llm", "blockchain", "inference", "rust"]
categories = ["web-programming", "api-bindings", "science"]

[workspace.dependencies]
# Async runtime
tokio = { version = "1.41", features = ["full"] }
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
prost = "0.13"
borsh = "1.5"

# Cryptography
sha3 = "0.10.8"
blake3 = "1.5"
x25519-dalek = "2.0"
ed25519-dalek = "2.1"
ml-kem = "0.3.0-pre"
ml-dsa = "0.1.0-rc.0"
chacha20poly1305 = "0.10"
aes-gcm = "0.10"
argon2 = "0.5"
zeroize = { version = "1.8", features = ["derive"] }
subtle = "2.6"

# Post-quantum cryptography
pqcrypto-hqc = "0.2"
pqcrypto-traits = "0.3"

# Networking
libp2p = { version = "0.54", features = ["tokio", "noise", "yamux", "tcp", "dns", "websocket", "identify", "kad", "gossipsub", "mdns", "request-response", "relay", "dcutr", "ping"] }
tonic = "0.12"
hyper = "1.4"
axum = "0.7"
reqwest = { version = "0.12", features = ["json", "stream"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
quinn = "0.11"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "sqlite"] }
rocksdb = "0.22"
redb = "2.1"
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }
sled = "0.34"

# AI/ML
candle-core = "0.8"
candle-nn = "0.8"
candle-transformers = "0.8"
tokenizers = "0.20"

# Additional dependencies for engine
either = "1.13"
image = "0.25"
indexmap = "2.6"
walkdir = "2.5"
rust-mcp-schema = "0.6"
rust-mcp-sdk = "0.6"
tokio-tungstenite = "0.24"
futures-util = "0.3"
http = "1.1"
pyo3 = "0.22"
utoipa = "5.1"
mistralrs-core = { version = "0.4", path = "engine/mistralrs-core" }
mistralrs = { version = "0.4", path = "engine/mistralrs" }
mistralrs-vision = { version = "0.4", path = "engine/mistralrs-vision" }
mistralrs-quant = { version = "0.4", path = "engine/mistralrs-quant" }
mistralrs-server-core = { version = "0.4", path = "engine/mistralrs-server-core" }
mistralrs-audio = { version = "0.4", path = "engine/mistralrs-audio" }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Testing
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.5"
quickcheck = "1.0"

# Utilities
hex = "0.4"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
config = "0.14"
rand = "0.8"
rand_core = "0.6"
uuid = { version = "1.11", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
merkle = "1.11"
futures = "0.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.bench]
inherits = "release"

[profile.dev]
opt-level = 0
debug = true

[profile.test]
opt-level = 2
debug = true
